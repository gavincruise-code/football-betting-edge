# fly.toml app configuration file generated for football-betting-edge on 2026-08-12T13:20:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'football-betting-edge'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8501'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
